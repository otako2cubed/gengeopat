<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幾何学模様ジェネレーター</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .container {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 320px;
            background-color: #f4f4f4;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
            z-index: 10;
        }
        .preview-area {
            flex-grow: 1;
            position: relative;
            background-color: #ffffff;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        h1 {
            font-size: 1.2rem;
            margin: 0 0 10px 0;
            color: #333;
            text-align: center;
        }
        .control-group {
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 15px;
        }
        .control-group:last-child {
            border-bottom: none;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #555;
            font-weight: 600;
        }
        .shape-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .shape-option {
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .shape-option input {
            margin-right: 5px;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        .range-value {
            float: right;
            font-size: 0.8rem;
            color: #777;
        }
        .color-input-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        input[type="color"] {
            border: none;
            width: 40px;
            height: 40px;
            cursor: pointer;
            background: none;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        button {
            flex: 1;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button.secondary {
            background-color: #6c757d;
        }
        button.secondary:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h1>Pattern Generator</h1>

        <div class="control-group">
            <label>図形の選択</label>
            <div class="shape-options">
                <label class="shape-option"><input type="radio" name="shape" value="circle" checked> 円 (Circle)</label>
                <label class="shape-option"><input type="radio" name="shape" value="square"> 正方形 (Square)</label>
                <label class="shape-option"><input type="radio" name="shape" value="triangle"> 三角形 (Triangle)</label>
                <label class="shape-option"><input type="radio" name="shape" value="hexagon"> 六角形 (Hexagon)</label>
                <label class="shape-option"><input type="radio" name="shape" value="wave"> 波線 (Wave)</label>
                <label class="shape-option"><input type="radio" name="shape" value="dot"> ドット (Dot)</label>
                <label class="shape-option"><input type="radio" name="shape" value="cross"> クロス (Cross)</label>
            </div>
        </div>

        <div class="control-group">
            <label>サイズ <span id="val-size" class="range-value">50</span></label>
            <input type="range" id="size" min="5" max="200" value="50">
        </div>

        <div class="control-group">
            <label>間隔 (Grid Spacing) <span id="val-spacing" class="range-value">80</span></label>
            <input type="range" id="spacing" min="20" max="300" value="80">
        </div>

        <div class="control-group">
            <label>回転 (Rotation) <span id="val-rotation" class="range-value">0°</span></label>
            <input type="range" id="rotation" min="0" max="360" value="0">
        </div>

        <div class="control-group">
            <label>線の太さ (Stroke Width) <span id="val-stroke" class="range-value">0 (Fill)</span></label>
            <input type="range" id="stroke" min="0" max="20" value="0">
            <small style="color:#666; display:block; margin-top:5px; font-size:0.75rem;">0の場合は塗りつぶしのみ</small>
        </div>

        <div class="control-group">
            <label>図形の色</label>
            <div class="color-input-wrapper">
                <input type="color" id="color" value="#3498db">
                <span id="hex-color">#3498db</span>
            </div>
        </div>

        <div class="control-group">
            <label>背景色</label>
            <div class="color-input-wrapper">
                <input type="color" id="bg-color" value="#ffffff">
                <span id="hex-bg-color">#ffffff</span>
            </div>
        </div>

        <div class="control-group">
            <label>不透明度 (Opacity) <span id="val-opacity" class="range-value">1.0</span></label>
            <input type="range" id="opacity" min="0.1" max="1.0" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <label>ランダム化 (ゆらぎ) <span id="val-randomness" class="range-value">0</span></label>
            <input type="range" id="randomness" min="0" max="100" value="0">
        </div>

        <div class="control-group">
            <label>書き出し (Export)</label>
            <div class="btn-group">
                <button id="btn-jpg">JPEG</button>
                <button id="btn-png" class="secondary">PNG</button>
            </div>
        </div>
    </div>

    <div class="preview-area" id="preview-area">
        <canvas id="canvas"></canvas>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const previewArea = document.getElementById('preview-area');

    // Controls
    const inputs = {
        shape: document.getElementsByName('shape'),
        size: document.getElementById('size'),
        spacing: document.getElementById('spacing'),
        rotation: document.getElementById('rotation'),
        stroke: document.getElementById('stroke'),
        color: document.getElementById('color'),
        bgColor: document.getElementById('bg-color'),
        opacity: document.getElementById('opacity'),
        randomness: document.getElementById('randomness')
    };

    // Value displays
    const displays = {
        size: document.getElementById('val-size'),
        spacing: document.getElementById('val-spacing'),
        rotation: document.getElementById('val-rotation'),
        stroke: document.getElementById('val-stroke'),
        opacity: document.getElementById('val-opacity'),
        randomness: document.getElementById('val-randomness'),
        color: document.getElementById('hex-color'),
        bgColor: document.getElementById('hex-bg-color')
    };

    function getSelectedShape() {
        for (const radio of inputs.shape) {
            if (radio.checked) return radio.value;
        }
        return 'circle';
    }

    function resizeCanvas() {
        canvas.width = previewArea.clientWidth;
        canvas.height = previewArea.clientHeight;
        draw();
    }

    function drawShape(shape, size) {
        ctx.beginPath();
        switch (shape) {
            case 'circle':
                ctx.arc(0, 0, size / 2, 0, Math.PI * 2);
                break;
            case 'square':
                ctx.rect(-size / 2, -size / 2, size, size);
                break;
            case 'triangle':
                // 正三角形
                const h = size * (Math.sqrt(3)/2);
                ctx.moveTo(0, -h/1.5); // Top
                ctx.lineTo(size/2, h/3); // Bottom Right
                ctx.lineTo(-size/2, h/3); // Bottom Left
                ctx.closePath();
                break;
            case 'hexagon':
                for (let i = 0; i < 6; i++) {
                    const angle_deg = 60 * i - 30;
                    const angle_rad = Math.PI / 180 * angle_deg;
                    const r = size / 2;
                    if (i === 0) ctx.moveTo(r * Math.cos(angle_rad), r * Math.sin(angle_rad));
                    else ctx.lineTo(r * Math.cos(angle_rad), r * Math.sin(angle_rad));
                }
                ctx.closePath();
                break;
            case 'wave':
                const w = size;
                const amp = size / 4;
                ctx.moveTo(-w/2, 0);
                ctx.bezierCurveTo(-w/4, -amp, 0, amp, w/4, 0);
                ctx.bezierCurveTo(w/2, -amp, 3*w/4, amp, w, 0); // Extend a bit
                // Simplify to a single S curve centered
                ctx.moveTo(-w/2, 0);
                ctx.bezierCurveTo(-w/6, -w/2, w/6, w/2, w/2, 0);
                break;
            case 'dot':
                ctx.arc(0, 0, size / 5, 0, Math.PI * 2);
                break;
            case 'cross':
                const t = size / 8; // thickness
                ctx.rect(-size/2, -t/2, size, t); // Horizontal
                ctx.rect(-t/2, -size/2, t, size); // Vertical
                break;
        }
    }

    function draw() {
        const width = canvas.width;
        const height = canvas.height;
        const shape = getSelectedShape();
        const size = parseInt(inputs.size.value);
        const spacing = parseInt(inputs.spacing.value);
        const rotation = parseInt(inputs.rotation.value);
        const strokeWidth = parseInt(inputs.stroke.value);
        const color = inputs.color.value;
        const bgColor = inputs.bgColor.value;
        const opacity = parseFloat(inputs.opacity.value);
        const randomness = parseInt(inputs.randomness.value);

        // Update displays
        displays.size.textContent = size;
        displays.spacing.textContent = spacing;
        displays.rotation.textContent = rotation + '°';
        displays.stroke.textContent = strokeWidth === 0 ? '0 (Fill)' : strokeWidth;
        displays.opacity.textContent = opacity;
        displays.randomness.textContent = randomness;
        displays.color.textContent = color;
        displays.bgColor.textContent = bgColor;

        // Background
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, width, height);

        // Grid calculation
        // Calculate needed cols and rows to cover screen + buffer for rotation/randomness
        const cols = Math.ceil(width / spacing) + 2;
        const rows = Math.ceil(height / spacing) + 2;

        ctx.globalAlpha = opacity;
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = strokeWidth;

        // Use a consistent seed for randomness is hard in JS without library,
        // but for "randomness" feature, we usually want it to be static per frame unless re-generated.
        // Here, we just use Math.random() inside the loop.
        // Note: This causes "jitter" if we were animating, but for static generation it's fine.
        // However, if we resize window, the pattern will change configuration. That's acceptable.

        // To make it deterministic (so resizing doesn't change the "random" pattern completely),
        // we would need a seeded random. For this simple app, re-randomizing on draw is okay.

        // Actually, let's keep it simple. Every draw call re-randomizes.

        for (let i = -1; i < cols; i++) {
            for (let j = -1; j < rows; j++) {
                ctx.save();

                let posX = i * spacing + (spacing / 2);
                let posY = j * spacing + (spacing / 2);

                // Randomness (Jitter)
                if (randomness > 0) {
                    const maxOffset = spacing * (randomness / 200); // Max 50% of spacing shift
                    posX += (Math.random() - 0.5) * 2 * maxOffset;
                    posY += (Math.random() - 0.5) * 2 * maxOffset;
                }

                ctx.translate(posX, posY);

                // Rotation
                let angle = rotation;
                if (randomness > 0) {
                    angle += (Math.random() - 0.5) * randomness * 2; // +/- randomness degrees
                }
                ctx.rotate(angle * Math.PI / 180);

                drawShape(shape, size);

                if (strokeWidth > 0) {
                    ctx.stroke();
                } else {
                    ctx.fill();
                }

                ctx.restore();
            }
        }
    }

    // Event Listeners
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', resizeCanvas);

    // Attach listeners to all inputs
    inputs.shape.forEach(r => r.addEventListener('change', draw));
    Object.values(inputs).forEach(input => {
        if (input instanceof HTMLElement && input.type !== 'radio') {
            input.addEventListener('input', draw);
        }
    });

    // Export Functions
    function downloadImage(format) {
        const link = document.createElement('a');
        link.download = `pattern.${format}`;
        link.href = canvas.toDataURL(`image/${format === 'jpg' ? 'jpeg' : 'png'}`);
        link.click();
    }

    document.getElementById('btn-jpg').addEventListener('click', () => downloadImage('jpg'));
    document.getElementById('btn-png').addEventListener('click', () => downloadImage('png'));

</script>

</body>
</html>
